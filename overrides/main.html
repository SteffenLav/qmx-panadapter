{% extends "base.html" %}

<!--
  Theme override: adds a "Buy me a coffee" (OZ1LAV) button to the site footer.
  Placed in the footer block (part of Material's persistent shell — NOT the
  content container that navigation.instant swaps), so the BMC widget script
  runs once on initial load and the rendered button survives instant nav.
-->
{% block footer %}
  {{ super() }}
  <div style="text-align:center; padding:18px 12px;">
    <script type="text/javascript"
            src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js"
            data-name="bmc-button"
            data-slug="OZ1LAV"
            data-color="#FFDD00"
            data-emoji="☕"
            data-font="Lato"
            data-text="Buy me a coffee"
            data-outline-color="#000000"
            data-font-color="#000000"
            data-coffee-color="#ffffff"></script>
  </div>
{% endblock %}
