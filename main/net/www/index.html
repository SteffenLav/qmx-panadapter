<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QMX+ Panadapter</title>
<style>
  :root {
    --bg: #0a0e14;
    --fg: #c5d4dd;
    --dim: #6a7a85;
    --accent: #ffb95a;
    --ok: #6ed27a;
    --bad: #d26e6e;
    --card: #131922;
    --border: #1f2937;
    --spec-bg: #000;
    --spec-grid: #1f2530;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1rem;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 1rem 0;
    color: var(--accent);
    letter-spacing: 0.05em;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 0.75rem;
  }
  .label { color: var(--dim); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .value { font-size: 1.4rem; margin-top: 0.2rem; }
  .freq { font-size: 1.8rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .charging { color: var(--ok); }
  .stale { opacity: 0.5; }
  #spec-card { padding: 0.5rem; margin-bottom: 0; }
  #spec-head { display: flex; justify-content: space-between; padding: 0 0.25rem 0.4rem 0.25rem; }
  #spec-status { font-size: 0.75rem; }
  #spec-status.ok  { color: var(--ok);  }
  #spec-status.bad { color: var(--bad); }
  #spec {
    display: block;
    width: 100%;
    height: auto;
    background: var(--spec-bg);
    border-radius: 4px;
    image-rendering: pixelated;
  }
  #waterfall {
    display: block;
    width: 100%;
    height: auto;
    background: var(--spec-bg);
    image-rendering: pixelated;
    margin-bottom: 0.75rem;
  }
  footer { color: var(--dim); font-size: 0.75rem; margin-top: 1rem; text-align: center; }
</style>
</head>
<body>
  <h1>QMX+ PANADAPTER</h1>
  <div class="card" id="spec-card">
    <div id="spec-head">
      <span class="label">Spectrum</span>
      <span id="spec-status" class="bad">disconnected</span>
    </div>
    <canvas id="spec" width="1024" height="256"></canvas>
  </div>
  <canvas id="waterfall" width="1024" height="512"></canvas>

  <div id="status" class="stale">
    <div class="card">
      <div class="label">VFO</div>
      <div class="value freq" id="freq">--</div>
    </div>
    <div class="card">
      <div class="row">
        <div>
          <div class="label">Battery</div>
          <div class="value"><span id="batt">--</span><span id="chg"></span></div>
        </div>
        <div>
          <div class="label">WiFi</div>
          <div class="value" id="wifi">--</div>
        </div>
      </div>
      <div style="margin-top: 0.6rem;">
        <div class="label">IP</div>
        <div class="value" id="ip">--</div>
      </div>
    </div>
  </div>
  <footer id="updated">never updated</footer>
<script>
"use strict";

/* ---------- /api/status @ 1 Hz ---------- */
function fmtFreq(hz) {
  if (hz === 0) return "no signal";
  return (hz / 1e6).toFixed(3) + " MHz";
}
async function tick() {
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const s = await r.json();
    document.getElementById("freq").textContent = fmtFreq(s.freq_hz);
    document.getElementById("batt").textContent =
      (s.battery.level >= 0 ? s.battery.level + "%" : "--");
    document.getElementById("chg").innerHTML =
      s.battery.charging ? ' <span class="charging">CHG</span>' : '';
    document.getElementById("wifi").textContent =
      s.wifi.ssid ? (s.wifi.ssid + "  " + s.wifi.rssi + " dBm") : "--";
    document.getElementById("ip").textContent = s.wifi.ip || "--";
    document.getElementById("updated").textContent =
      "updated " + new Date().toLocaleTimeString();
    document.getElementById("status").classList.remove("stale");
  } catch (e) {
    document.getElementById("status").classList.add("stale");
    document.getElementById("updated").textContent = "error: " + e.message;
  }
}
tick();
setInterval(tick, 1000);

/* ---------- /ws spectrum + waterfall ---------- */
const SPEC_W = 1024;
const SPEC_H = 256;
const WF_H = 512;
const FRAME_TYPE_SPECTRUM = 0x01;
const HEADER_LEN = 2;

const canvas = document.getElementById("spec");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("spec-status");

/* Spectrum render: closed polyline -> dim fill, then bright stroke on top. */
function drawSpectrum(bytes) {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, SPEC_W, SPEC_H);

  ctx.fillStyle = "#1f2530";
  for (const db of [-120, -100, -80, -60, -40]) {
    const q = (db + 130) * 255 / 100;
    const y = SPEC_H - 1 - Math.round(q * (SPEC_H - 1) / 255);
    ctx.fillRect(0, y, SPEC_W, 1);
  }

  ctx.beginPath();
  ctx.moveTo(0, SPEC_H);
  for (let x = 0; x < SPEC_W; x++) {
    const y = SPEC_H - 1 - Math.round(bytes[x] * (SPEC_H - 1) / 255);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(SPEC_W - 1, SPEC_H);
  ctx.closePath();
  ctx.fillStyle = "#003800";
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(0, SPEC_H - 1 - Math.round(bytes[0] * (SPEC_H - 1) / 255));
  for (let x = 1; x < SPEC_W; x++) {
    const y = SPEC_H - 1 - Math.round(bytes[x] * (SPEC_H - 1) / 255);
    ctx.lineTo(x, y);
  }
  ctx.strokeStyle = "#07e007";
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

/* ---------- Waterfall: 512 rows, auto-tracking floor, thermal palette ---------- */
const wfCanvas = document.getElementById("waterfall");
const wfCtx = wfCanvas.getContext("2d");
const wfRow = wfCtx.createImageData(SPEC_W, 1);

const wfPalette = (() => {
  const stops = [
    [0.00, [0,   0,   0  ]],
    [0.20, [0,   0,   128]],
    [0.40, [0,   128, 192]],
    [0.60, [0,   192, 0  ]],
    [0.80, [255, 224, 0  ]],
    [1.00, [255, 0,   0  ]],
  ];
  const lut = new Uint8Array(256 * 4);
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    let s = 0;
    while (s < stops.length - 2 && stops[s + 1][0] < t) s++;
    const [t0, c0] = stops[s];
    const [t1, c1] = stops[s + 1];
    const f = (t - t0) / (t1 - t0);
    lut[i * 4 + 0] = c0[0] + (c1[0] - c0[0]) * f;
    lut[i * 4 + 1] = c0[1] + (c1[1] - c0[1]) * f;
    lut[i * 4 + 2] = c0[2] + (c1[2] - c0[2]) * f;
    lut[i * 4 + 3] = 255;
  }
  return lut;
})();

let wfFloor = 64;
let wfFrameCount = 0;
const WF_FLOOR_ALPHA  = 0.3;
const WF_FLOOR_PERIOD = 10;
const WF_DYN_RANGE_Q  = 80;
const WF_SCALE        = 255 / WF_DYN_RANGE_Q;
const WF_FLOOR_OFFSET = 32;

wfCtx.fillStyle = "#000";
wfCtx.fillRect(0, 0, SPEC_W, WF_H);

function median256(bytes) {
  const hist = new Uint32Array(256);
  for (let i = 0; i < bytes.length; i++) hist[bytes[i]]++;
  const half = bytes.length >> 1;
  let acc = 0;
  for (let i = 0; i < 256; i++) {
    acc += hist[i];
    if (acc >= half) return i;
  }
  return 255;
}

function drawWaterfall(bytes) {
  if (++wfFrameCount >= WF_FLOOR_PERIOD) {
    wfFrameCount = 0;
    const m = median256(bytes);
    wfFloor = WF_FLOOR_ALPHA * (m + 15) + (1 - WF_FLOOR_ALPHA) * wfFloor;  // +15 q-units = +6 dB, matches device
  }

  const floor = wfFloor;
  const data = wfRow.data;
  for (let x = 0; x < SPEC_W; x++) {
    let idx = (bytes[x] - floor) * WF_SCALE + WF_FLOOR_OFFSET;
    if (idx < 0) idx = 0;
    else if (idx > 255) idx = 255;
    idx = idx | 0;
    const p = idx * 4;
    const o = x * 4;
    data[o    ] = wfPalette[p    ];
    data[o + 1] = wfPalette[p + 1];
    data[o + 2] = wfPalette[p + 2];
    data[o + 3] = 255;
  }

  wfCtx.drawImage(wfCanvas, 0, 1);
  wfCtx.putImageData(wfRow, 0, 0);
}

/* ---------- WebSocket plumbing ---------- */
let ws = null;
let frameCount = 0;
let lastFpsAt = performance.now();

function connectWs() {
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
  ws = new WebSocket(url);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    statusEl.textContent = "connected";
    statusEl.className = "ok";
  };

  ws.onmessage = (ev) => {
    const buf = new Uint8Array(ev.data);
    if (buf.length < HEADER_LEN + SPEC_W) return;
    if (buf[0] !== FRAME_TYPE_SPECTRUM) return;
    const payload = buf.subarray(HEADER_LEN, HEADER_LEN + SPEC_W);
    drawSpectrum(payload);
    drawWaterfall(payload);

    frameCount++;
    const now = performance.now();
    if (now - lastFpsAt >= 1000) {
      const fps = (frameCount * 1000 / (now - lastFpsAt)).toFixed(1);
      statusEl.textContent = "connected  " + fps + " fps";
      statusEl.className = "ok";
      frameCount = 0;
      lastFpsAt = now;
    }
  };

  ws.onclose = () => {
    statusEl.textContent = "disconnected, retrying...";
    statusEl.className = "bad";
    setTimeout(connectWs, 2000);
  };

  ws.onerror = () => { /* onclose follows; handle there */ };
}
connectWs();
</script>
</body>
</html>
