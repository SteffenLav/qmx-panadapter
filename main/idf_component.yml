dependencies:
  idf:
    version: ">=5.4.0"

  espressif/esp_lcd_ili9881c: "^1.1.0"
  espressif/esp_lcd_touch_gt911: "^1.1.1~2"
  espressif/esp_lcd_touch_st7123: "^1.0.0"
  espressif/esp_codec_dev: "^1.3.0"
  espressif/esp_lvgl_port: "~2.5.0"

  espressif/usb_host_cdc_acm: "^2.0.0"
  espressif/usb_host_uac: "^1.4.0"
  espressif/usb_host_hid: "^1.0.0"

  espressif/esp-dsp: "^1.6.0"

  # Helix MP3, for the web-radio player (main/audio/webradio.c). Fixed-point
  # and small - the same decoder dmatking/esp32-p4-webradio uses on this exact
  # board, which is why it is this one and not a guess.
  chmorgan/esp-libhelix-mp3: "^1.0.3"

  # mDNS: reach the Tab5 as qmx.local instead of hunting an IP that changes with
  # the network. Added after an evening lost to exactly that (roamed onto a hotel
  # WiFi, new lease, no way to find it).
  espressif/mdns: "^1.2.0"

  lvgl/lvgl: "~9.2.0"
  espressif/esp_wifi_remote:
    version: "0.8.5"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: "1.4.0"
    rules:
      - if: "target in [esp32p4]"
