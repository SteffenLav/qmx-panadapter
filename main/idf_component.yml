dependencies:
  idf:
    version: ">=5.4.0"

  espressif/esp_lcd_ili9881c: "^1.1.0"
  espressif/esp_lcd_touch_gt911: "^1.1.1~2"
  espressif/esp_lcd_touch_st7123: "^1.0.0"
  espressif/esp_codec_dev: "^1.3.0"
  espressif/esp_lvgl_port: "~2.5.0"

  espressif/usb_host_cdc_acm: "^2.0.0"
  espressif/usb_host_uac: "^1.4.0"
  espressif/usb_host_hid: "^1.0.0"

  espressif/esp-dsp: "^1.6.0"

  # ⛔ NO MP3 DECODER HERE ANY MORE, AND THAT IS THE POINT.
  # chmorgan/esp-libhelix-mp3 was removed 2026-11-18. The Component Registry
  # labels it Apache-2.0, but the label covers the WRAPPER: its submodule
  # ships RealNetworks' Helix DNA decoder under the RealNetworks Public
  # Source License 1.0, which is copyleft over combined works (§4.1) and
  # GPL-incompatible. This firmware is GPL-3.
  # The web radio now uses minimp3 (CC0 1.0), vendored in the tree at
  # components/minimp3. In-tree on purpose: a registry entry would put the
  # licence back behind a manifest label, and the label was the whole fault.

  # mDNS: reach the Tab5 as qmx.local instead of hunting an IP that changes with
  # the network. Added after an evening lost to exactly that (roamed onto a hotel
  # WiFi, new lease, no way to find it).
  # Pinned 2026-11-15. "^1.2.0" floated and dependencies.lock is git-ignored,
  # so each worktree resolved its own mdns (main 1.11.3, rtty 1.15.1). Only
  # 1.15 has CONFIG_MDNS_ENABLE_BROWSE, so a sdkconfig committed from one tree
  # was rewritten by every build in the other - a permanently dirty sdkconfig.
  # 1.11.3 is what the release candidate was verified with on bench1.
  espressif/mdns: "==1.11.3"

  lvgl/lvgl: "~9.2.0"
  espressif/esp_wifi_remote:
    version: "0.8.5"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: "1.4.0"
    rules:
      - if: "target in [esp32p4]"
