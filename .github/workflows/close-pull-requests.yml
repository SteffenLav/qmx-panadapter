name: Auto-close pull requests

# This is a solo project that does not accept outside code contributions.
# Any pull request is automatically greeted with a friendly note pointing to
# the feedback channels, then closed. Uses pull_request_target so it has write
# access even for PRs opened from forks; it never checks out or runs PR code,
# so there is no security risk from the elevated token.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = [
              "Thanks for your interest in the QMX Panadapter! 🙏",
              "",
              "This is a **solo project** and **pull requests are not being accepted right now** —",
              "all coding is done by the author (OZ1LAV) at his own pace. This is a deliberate",
              "choice while the project is still finding its shape, not a reflection on your work.",
              "",
              "Your feedback is genuinely welcome, though. Please open a bug report or feature",
              "request via either:",
              "",
              "- **GitHub Issues:** https://github.com/SteffenLav/qmx-panadapter/issues",
              "- **QRPLabs Groups.io thread:** https://groups.io/g/QRPLabs/topic/119565643",
              "",
              "See [CONTRIBUTING.md](https://github.com/SteffenLav/qmx-panadapter/blob/main/CONTRIBUTING.md)",
              "for the full policy. This PR is being closed automatically — thanks for understanding. 73",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: "closed",
            });
