<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430"
     role="img" aria-labelledby="t d">
  <title id="t">The FT8 slot, and what DT and DTR measure</title>
  <desc id="d">An FT8 slot is 15 seconds. A transmission occupies the first 12.64
  seconds of it, leaving 2.36 seconds of dead air. Our own transmission starts 14
  milliseconds after the boundary. A received signal is timed from the boundary:
  DTR is that raw offset and includes about half a second of receive latency from
  the QMX and USB buffering, while DT is the same offset corrected against the
  band consensus, so an on-time station reads about zero. The decode runs after
  the capture, in the dead air and the start of the next slot.</desc>

  <rect x="0" y="0" width="920" height="430" rx="6" fill="#fbfbfd"/>

  <style>
    .h    { font:600 14px system-ui,sans-serif; fill:#17203a; }
    .s    { font:12px system-ui,sans-serif; fill:#3d4663; }
    .tick { font:11px system-ui,sans-serif; fill:#5a6480; }
    .ctl  { font:600 12px system-ui,sans-serif; fill:#8a2f2f; }
    .note { font:italic 12px system-ui,sans-serif; fill:#50405e; }
    .axis { stroke:#44506b; stroke-width:1.5; }
    .bnd  { stroke:#17203a; stroke-width:2; }
    .dim  { stroke:#b04545; stroke-width:1.3; }
    .lead { stroke:#8a8f9e; stroke-width:1; stroke-dasharray:3 3; }
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04545"/>
    </marker>
    <marker id="a2s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#b04545"/>
    </marker>
  </defs>

  <!-- geometry: x = 70 at t=0, x = 770 at t=15 s  => 46.667 px/s -->
  <text class="h" x="70" y="44">One FT8 slot — 15 s</text>
  <text class="s" x="70" y="63">FT4 is the same shape at 7.5 s: a 5.04 s burst and 2.46 s of dead air.</text>

  <!-- slot boundaries -->
  <line class="bnd" x1="70"  y1="88" x2="70"  y2="300"/>
  <line class="bnd" x1="770" y1="88" x2="770" y2="300"/>
  <text class="tick" x="70"  y="82" text-anchor="middle">0 s — slot boundary</text>
  <text class="tick" x="770" y="82" text-anchor="middle">15 s — next slot</text>

  <!-- the air: burst + dead air -->
  <rect x="70" y="100" width="590" height="42" rx="3" fill="#eef2ff" stroke="#3b4a73" stroke-width="1.5"/>
  <text class="h" x="365" y="120" text-anchor="middle">A transmission — 12.64 s</text>
  <text class="s" x="365" y="136" text-anchor="middle">79 symbols</text>
  <rect x="660" y="100" width="110" height="42" rx="3" fill="#f3f3f6" stroke="#8a8f9e" stroke-width="1.2"/>
  <text class="s" x="715" y="120" text-anchor="middle">dead air</text>
  <text class="s" x="715" y="136" text-anchor="middle">2.36 s</text>

  <!-- our TX -->
  <line class="dim" x1="70.7" y1="155" x2="70.7" y2="178"/>
  <text class="ctl" x="80" y="172">our TX starts at +14 ms</text>
  <text class="s" x="80" y="188">measured, not late — the boundary is the reference</text>

  <!-- a received signal, arriving late -->
  <rect x="140" y="205" width="590" height="34" rx="3" fill="#eefaf1" stroke="#2f6b45" stroke-width="1.5"/>
  <text class="s" x="435" y="227" text-anchor="middle">a station you receive — same 12.64 s, offset from the boundary</text>

  <!-- DTR: boundary to signal start -->
  <line class="dim" x1="70" y1="258" x2="140" y2="258" marker-start="url(#a2s)" marker-end="url(#a2)"/>
  <line class="lead" x1="140" y1="239" x2="140" y2="262"/>
  <text class="ctl" x="150" y="256">DTR — the raw offset</text>
  <text class="s" x="150" y="272">browser only. Includes ~0.5 s of receive latency: the QMX SDR plus USB buffering.</text>

  <!-- DT -->
  <text class="ctl" x="150" y="296">DT — the same offset corrected against the band consensus</text>
  <text class="s" x="150" y="312">What WSJT-X shows. An on-time station reads about 0.0, because the shared latency cancels.</text>
  <text class="s" x="150" y="328">⚠ Two different quantities. DT judges the station; DTR judges your own clock and path.</text>

  <!-- capture / decode band -->
  <line class="axis" x1="70" y1="356" x2="850" y2="356"/>
  <rect x="70" y="360" width="620" height="26" rx="3" fill="#fff6ec" stroke="#8a5520" stroke-width="1.3"/>
  <text class="s" x="380" y="378" text-anchor="middle">capture the slot</text>
  <rect x="690" y="360" width="160" height="26" rx="3" fill="#fde8e8" stroke="#8a2f2f" stroke-width="1.3"/>
  <text class="s" x="770" y="378" text-anchor="middle">decode: STFT, then LDPC</text>
  <text class="note" x="70" y="406">The decode runs after the capture — in the dead air and into the next slot. That is why a reply has to be decided before the next boundary, not after it.</text>
</svg>
