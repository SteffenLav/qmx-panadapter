<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400"
     role="img" aria-labelledby="t d">
  <title id="t">The WSPR cycle, and what the transmit schedule means</title>
  <desc id="d">A WSPR cycle is two minutes. A transmission starts one second into
  an even minute and runs 110.6 seconds — 162 symbols of 0.683 seconds — leaving
  about 8 seconds at the end. On a receive cycle the whole two minutes is
  captured and decoded within a 115 second budget. The schedule is two counts:
  transmit this many cycles, then receive this many, repeating. Two transmit and
  eight receive is one burst every twenty minutes. Setting transmit cycles to
  zero is how transmitting is turned off.</desc>

  <rect x="0" y="0" width="920" height="400" rx="6" fill="#fbfbfd"/>

  <style>
    .h    { font:600 14px system-ui,sans-serif; fill:#17203a; }
    .s    { font:12px system-ui,sans-serif; fill:#3d4663; }
    .tick { font:11px system-ui,sans-serif; fill:#5a6480; }
    .ctl  { font:600 12px system-ui,sans-serif; fill:#8a2f2f; }
    .note { font:italic 12px system-ui,sans-serif; fill:#50405e; }
    .bnd  { stroke:#17203a; stroke-width:2; }
    .dim  { stroke:#b04545; stroke-width:1.3; }
  </style>
  <defs>
    <marker id="w1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04545"/>
    </marker>
  </defs>

  <!-- x = 70 at t=0, x = 790 at t=120 s  => 6 px/s -->
  <text class="h" x="70" y="42">One WSPR cycle — 2 minutes</text>

  <line class="bnd" x1="70"  y1="60" x2="70"  y2="186"/>
  <line class="bnd" x1="790" y1="60" x2="790" y2="186"/>
  <text class="tick" x="70"  y="74" text-anchor="start">even minute, +0 s</text>
  <text class="tick" x="790" y="74" text-anchor="end">+120 s</text>

  <!-- a transmit cycle -->
  <text class="s" x="70" y="100">On a TRANSMIT cycle</text>
  <rect x="76" y="108" width="664" height="38" rx="3" fill="#fde8e8" stroke="#8a2f2f" stroke-width="1.5"/>
  <text class="h" x="408" y="127" text-anchor="middle">transmitting — 110.6 s</text>
  <text class="s" x="408" y="142" text-anchor="middle">162 symbols of 0.683 s</text>
  <rect x="740" y="108" width="50" height="38" rx="3" fill="#f3f3f6" stroke="#8a8f9e" stroke-width="1.2"/>
  <text class="s" x="765" y="131" text-anchor="middle">~8 s</text>
  <line class="dim" x1="76" y1="160" x2="76" y2="178"/>
  <text class="ctl" x="84" y="174">starts 1 s in, by the protocol</text>

  <!-- a receive cycle -->
  <text class="s" x="70" y="214">On a RECEIVE cycle</text>
  <line class="bnd" x1="70"  y1="222" x2="70"  y2="276"/>
  <line class="bnd" x1="790" y1="222" x2="790" y2="276"/>
  <rect x="70" y="226" width="720" height="24" rx="3" fill="#fff6ec" stroke="#8a5520" stroke-width="1.3"/>
  <text class="s" x="430" y="243" text-anchor="middle">capture the whole cycle</text>
  <rect x="70" y="252" width="690" height="22" rx="3" fill="#eefaf1" stroke="#2f6b45" stroke-width="1.3"/>
  <text class="s" x="415" y="268" text-anchor="middle">decode — 115 s budget, as many candidates as fit</text>

  <!-- the schedule -->
  <text class="h" x="70" y="308">The schedule is two counts — transmit this many cycles, then receive this many</text>
  <g>
    <rect x="70"  y="318" width="68" height="28" rx="3" fill="#fde8e8" stroke="#8a2f2f" stroke-width="1.3"/>
    <rect x="142" y="318" width="68" height="28" rx="3" fill="#fde8e8" stroke="#8a2f2f" stroke-width="1.3"/>
    <rect x="214" y="318" width="68" height="28" rx="3" fill="#eefaf1" stroke="#2f6b45" stroke-width="1.2"/>
    <rect x="286" y="318" width="68" height="28" rx="3" fill="#eefaf1" stroke="#2f6b45" stroke-width="1.2"/>
    <rect x="358" y="318" width="68" height="28" rx="3" fill="#eefaf1" stroke="#2f6b45" stroke-width="1.2"/>
    <rect x="430" y="318" width="68" height="28" rx="3" fill="#eefaf1" stroke="#2f6b45" stroke-width="1.2"/>
    <rect x="502" y="318" width="68" height="28" rx="3" fill="#eefaf1" stroke="#2f6b45" stroke-width="1.2"/>
    <rect x="574" y="318" width="68" height="28" rx="3" fill="#eefaf1" stroke="#2f6b45" stroke-width="1.2"/>
    <rect x="646" y="318" width="68" height="28" rx="3" fill="#eefaf1" stroke="#2f6b45" stroke-width="1.2"/>
    <rect x="718" y="318" width="68" height="28" rx="3" fill="#eefaf1" stroke="#2f6b45" stroke-width="1.2"/>
  </g>
  <text class="s" x="104" y="337" text-anchor="middle">TX</text>
  <text class="s" x="176" y="337" text-anchor="middle">TX</text>
  <text class="s" x="428" y="337" text-anchor="middle">receive — 8 cycles</text>
  <text class="s" x="70" y="364">Transmit 2, receive 8: one pair of bursts every 20 minutes, then it repeats. Transmit cycles = 0 is how transmitting is turned off.</text>
  <text class="note" x="70" y="384">The first burst after you switch transmitting on is always the very next cycle, whatever the schedule says — the duty has nothing useful to say about the first one.</text>
</svg>
