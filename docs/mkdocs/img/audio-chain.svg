<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470"
     role="img" aria-labelledby="t d">
  <title id="t">The receiver audio chain, and where each control acts</title>
  <desc id="d">IQ leaves the QMX over USB at 48000 pairs per second. The Tab5
  demodulates it, then sends the result either to its own speaker and headphone
  jack at 48 kHz, or to a browser as 12 kHz mono mu-law over the WebSocket. Four
  controls act at four different points: QMX RF gain before the radio's own
  conversion, QMX volume on everything downstream, RX Volume on the Tab5 speaker
  only, and the browser's own volume on the streamed audio only. While a browser
  is listening the Tab5 mutes its speaker.</desc>

  <!-- Own light panel, so the diagram reads on a light OR a dark page: an
       <img>-embedded SVG does not inherit the page's currentColor. -->
  <rect x="0" y="0" width="920" height="470" rx="6" fill="#fbfbfd"/>

  <style>
    .box   { fill:#fff; stroke:#44506b; stroke-width:1.5; }
    .radio { fill:#eef2ff; stroke:#3b4a73; stroke-width:1.5; }
    .out   { fill:#eefaf1; stroke:#2f6b45; stroke-width:1.5; }
    .web   { fill:#fff6ec; stroke:#8a5520; stroke-width:1.5; }
    .h     { font:600 14px system-ui,sans-serif; fill:#17203a; }
    .s     { font:12px system-ui,sans-serif; fill:#3d4663; }
    .ctl   { font:600 12px system-ui,sans-serif; fill:#8a2f2f; }
    .note  { font:italic 12px system-ui,sans-serif; fill:#50405e; }
    .wire  { stroke:#44506b; stroke-width:1.8; fill:none; }
    .cwire { stroke:#b04545; stroke-width:1.3; fill:none; stroke-dasharray:4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#44506b"/>
    </marker>
    <marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04545"/>
    </marker>
  </defs>

  <!-- QMX -->
  <rect class="radio" x="20" y="150" width="150" height="86" rx="5"/>
  <text class="h" x="95" y="180" text-anchor="middle">QMX / QMX+</text>
  <text class="s" x="95" y="200" text-anchor="middle">receives, outputs I/Q</text>
  <text class="s" x="95" y="218" text-anchor="middle">in DiGi / IQ mode</text>

  <!-- USB -->
  <path class="wire" d="M170,193 L250,193" marker-end="url(#a)"/>
  <text class="s" x="210" y="183" text-anchor="middle">USB</text>
  <text class="s" x="210" y="211" text-anchor="middle">48 000 pairs/s</text>

  <!-- DSP -->
  <rect class="box" x="250" y="150" width="150" height="86" rx="5"/>
  <text class="h" x="325" y="180" text-anchor="middle">Tab5 DSP</text>
  <text class="s" x="325" y="200" text-anchor="middle">48 kHz I/Q</text>
  <text class="s" x="325" y="218" text-anchor="middle">FFT + demodulator</text>

  <!-- to spectrum -->
  <path class="wire" d="M325,150 L325,110 L470,110" marker-end="url(#a)"/>
  <rect class="box" x="470" y="86" width="170" height="48" rx="5"/>
  <text class="h" x="555" y="107" text-anchor="middle">Spectrum + waterfall</text>
  <text class="s" x="555" y="124" text-anchor="middle">not audio - the same I/Q</text>

  <!-- AGC -->
  <path class="wire" d="M400,193 L470,193" marker-end="url(#a)"/>
  <rect class="box" x="470" y="162" width="150" height="62" rx="5"/>
  <text class="h" x="545" y="186" text-anchor="middle">AGC</text>
  <text class="s" x="545" y="205" text-anchor="middle">ceiling, attack, release</text>
  <text class="s" x="545" y="220" text-anchor="middle">or fixed gain</text>

  <!-- split: speaker branch -->
  <path class="wire" d="M620,180 L660,180 L660,282 L700,282" marker-end="url(#a)"/>
  <rect class="out" x="700" y="252" width="200" height="60" rx="5"/>
  <text class="h" x="800" y="275" text-anchor="middle">Tab5 speaker / headphones</text>
  <text class="s" x="800" y="294" text-anchor="middle">I2S codec, 48 kHz stereo</text>

  <!-- split: web branch -->
  <path class="wire" d="M620,206 L660,206 L660,380 L700,380" marker-end="url(#a)"/>
  <rect class="web" x="700" y="350" width="200" height="60" rx="5"/>
  <text class="h" x="800" y="373" text-anchor="middle">Browser</text>
  <text class="s" x="800" y="392" text-anchor="middle">12 kHz mono mu-law, WebSocket</text>
  <text class="s" x="668" y="345">decimate, 3 s buffer</text>

  <!-- exclusivity -->
  <path class="cwire" d="M790,350 L790,312" marker-end="url(#ca)"/>
  <text class="ctl" x="800" y="334" text-anchor="start">mutes</text>
  <text class="note" x="20" y="440">While a browser is listening the Tab5 mutes its own speaker, and hands the audio back when you stop. One listener at a time, deliberately.</text>

  <!-- the four controls -->
  <text class="ctl" x="95" y="130" text-anchor="middle">QMX RF gain</text>
  <path class="cwire" d="M95,136 L95,150" marker-end="url(#ca)"/>
  <text class="s" x="95" y="114" text-anchor="middle">per band, 0-99 dB</text>

  <text class="ctl" x="95" y="262" text-anchor="middle">QMX volume</text>
  <path class="cwire" d="M95,250 L95,236" marker-end="url(#ca)"/>
  <text class="s" x="95" y="279" text-anchor="middle">everything downstream,</text>
  <text class="s" x="95" y="294" text-anchor="middle">the browser included</text>

  <text class="ctl" x="800" y="240" text-anchor="middle">RX Volume</text>
  <path class="cwire" d="M800,245 L800,252" marker-end="url(#ca)"/>
  <text class="s" x="800" y="225" text-anchor="middle">this speaker only</text>

  <text class="ctl" x="800" y="432" text-anchor="middle">your browser's volume</text>
  <path class="cwire" d="M800,420 L800,410" marker-end="url(#ca)"/>
</svg>
